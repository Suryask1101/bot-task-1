replicaCount: 2

image:
  repository: demo-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8080

config:
  appName: demo-service
  version: "1.0.0"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
